name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "work/**"
      - "repair/**"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify ChatGPT exact-Desktop-Commander app contract
        run: python -m unittest -v tools/test_workbridge_desktop_commander_plugin.py
      - name: Verify modules
        run: go mod verify
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/workbridge-mcp
      - name: Build Windows binary for smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: go build -trimpath -o workbridge-mcp.exe ./cmd/workbridge-mcp
      - name: Stdio MCP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-WorkBridgeBinary.ps1 -Binary ./workbridge-mcp.exe
      - name: HTTP MCP smoke under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-WorkBridgeHttpBinary.ps1 -Binary .\workbridge-mcp.exe
      - name: Release packaging smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/New-WorkBridgeRelease.ps1 -Binary ./workbridge-mcp.exe -OutputDirectory ./dist -Version ci
      - name: Parse Lappy installer under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\scripts\Install-WorkBridgeLappy.ps1"),[ref]$tokens,[ref]$errors)|Out-Null; if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error; exit 1}'
      - name: Verify Lappy listener ownership guards under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-WorkBridgeLappyInstallerGuards.ps1
      - name: Parse Desktop Commander duplicate installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\scripts\Install-DesktopCommanderDuplicate.ps1"),[ref]$tokens,[ref]$errors)|Out-Null; if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error; exit 1}'

  desktop-commander-duplicate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/DesktopCommanderMCP/package-lock.json
      - name: Verify exact upstream pin
        shell: bash
        run: |
          test "$(git -C upstream/DesktopCommanderMCP rev-parse HEAD)" = "550a0b3e31da18b7cf25e87ed840e3d953b6da42"
          test "$(node -p "require('./upstream/DesktopCommanderMCP/package.json').version")" = "0.2.51"
      - name: Install exact upstream dependencies without lifecycle telemetry
        working-directory: upstream/DesktopCommanderMCP
        run: npm ci --ignore-scripts
      - name: Prime pinned ripgrep download cache on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageVersion = "1.17.0"
          $releaseVersion = "v15.0.0"
          $assetName = "ripgrep-$releaseVersion-x86_64-pc-windows-msvc.zip"
          $expectedSha256 = "5b7f6a3020739ac4bdf2c32300f14388456361bea054d35270a18a3c9949b932"
          $cacheDir = Join-Path ([IO.Path]::GetTempPath()) "vscode-ripgrep-cache-$packageVersion"
          $assetPath = Join-Path $cacheDir $assetName
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          if (Test-Path -LiteralPath $assetPath -PathType Leaf) {
            $cachedSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
            if ($cachedSha256 -ne $expectedSha256) {
              Remove-Item -LiteralPath $assetPath -Force
            }
          }
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            $downloadPath = "$assetPath.download"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/microsoft/ripgrep-prebuilt/releases/download/$releaseVersion/$assetName" -OutFile $downloadPath
            $downloadSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloadPath).Hash.ToLowerInvariant()
            if ($downloadSha256 -ne $expectedSha256) {
              throw "ripgrep bootstrap hash mismatch: expected $expectedSha256 got $downloadSha256"
            }
            Move-Item -LiteralPath $downloadPath -Destination $assetPath -Force
          }

      - name: Run upstream functional ripgrep rebuild only
        working-directory: upstream/DesktopCommanderMCP
        run: npm rebuild @vscode/ripgrep
      - name: Build exact Desktop Commander source
        working-directory: upstream/DesktopCommanderMCP
        run: npm run build
      - name: Verify upstream ripgrep runtime without install telemetry
        working-directory: upstream/DesktopCommanderMCP
        run: node dist/npm-scripts/verify-ripgrep.js
      - name: Execute exact upstream Desktop Commander MCP surface
        run: node scripts/Test-DesktopCommanderDuplicate.mjs

      - name: Apply and qualify WorkBridge Desktop Commander process overlay
        shell: bash
        run: |
          set -euo pipefail
          cp overlays/desktop-commander/src/terminal-manager.ts upstream/DesktopCommanderMCP/src/terminal-manager.ts
          cp overlays/desktop-commander/src/workbridge-process-admission.ts upstream/DesktopCommanderMCP/src/workbridge-process-admission.ts
          cp overlays/desktop-commander/test/test-workbridge-process-concurrency.js upstream/DesktopCommanderMCP/test/test-workbridge-process-concurrency.js
          cd upstream/DesktopCommanderMCP
          npm run build
          node test/test-workbridge-process-concurrency.js


  windows-gitless-desktop-commander:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install and qualify without Git on PATH
        shell: powershell
        run: |
          $node = (Get-Command node -ErrorAction Stop).Source
          $nodeDir = Split-Path -Parent $node
          $npm = Join-Path $nodeDir "npm.cmd"
          if (-not (Test-Path -LiteralPath $npm -PathType Leaf)) {
            throw "npm.cmd missing next to setup-node runtime"
          }

          # Simulate the user's clean workstation: Node is available only
          # because the bootstrap provides it, and Git is deliberately absent.
          $powerShellDir = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0"
          # Deliberately exclude the portable Node directory from PATH.
          # The installer must expose Node to npm child scripts itself.
          $env:PATH = "$powerShellDir;$env:SystemRoot\System32;$env:SystemRoot"
          if (Get-Command git -ErrorAction SilentlyContinue) {
            throw "Git unexpectedly remained discoverable in gitless qualification"
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "DesktopCommanderMCP-installed"
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Install-DesktopCommanderDuplicate.ps1 -InstallRoot $installRoot -NodeExe $node -NpmExe $npm
          if ($LASTEXITCODE -ne 0) {
            throw "gitless installer failed"
          }

          $manifest = Get-Content -Raw -Encoding UTF8 (Join-Path $installRoot "workbridge-desktop-commander.manifest.json") | ConvertFrom-Json
          if ($manifest.upstream_commit -ne "550a0b3e31da18b7cf25e87ed840e3d953b6da42") {
            throw "installed upstream pin mismatch"
          }
          if ($manifest.unrestricted_command_string_shell -ne $true) {
            throw "installed duplicate lost unrestricted command-string declaration"
          }
          if ($manifest.workbridge_process_concurrency_default -ne 4) {
            throw "installed duplicate process-concurrency default mismatch"
          }
          if ($manifest.workbridge_process_concurrency_max -ne 32) {
            throw "installed duplicate process-concurrency maximum mismatch"
          }
          if ($manifest.workbridge_process_concurrency_env -ne "WORKBRIDGE_EXECUTION_CAPACITY") {
            throw "installed duplicate process-concurrency environment binding mismatch"
          }
          if ($manifest.workbridge_overlay -ne "bounded-process-concurrency-v2") {
            throw "installed duplicate overlay identity mismatch"
          }

          $env:DESKTOP_COMMANDER_ROOT = $installRoot
          $packagedNode = Join-Path $installRoot "workbridge-runtime\node.exe"
          & $packagedNode .\scripts\Test-DesktopCommanderDuplicate.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "installed Desktop Commander acceptance probe failed"
          }

  windows-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Cross-build Windows amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/workbridge-mcp-windows-amd64.exe ./cmd/workbridge-mcp
          sha256sum dist/workbridge-mcp-windows-amd64.exe
