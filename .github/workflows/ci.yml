name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "work/**"
      - "repair/**"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/workbridge-mcp
      - name: Build Windows binary for smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: go build -trimpath -o workbridge-mcp.exe ./cmd/workbridge-mcp
      - name: Stdio MCP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-WorkBridgeBinary.ps1 -Binary ./workbridge-mcp.exe
      - name: Release packaging smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/New-WorkBridgeRelease.ps1 -Binary ./workbridge-mcp.exe -OutputDirectory ./dist -Version ci

  windows-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Cross-build Windows amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/workbridge-mcp-windows-amd64.exe ./cmd/workbridge-mcp
          sha256sum dist/workbridge-mcp-windows-amd64.exe
