name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "work/**"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/workbridge-mcp

  windows-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Cross-build Windows amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/workbridge-mcp-windows-amd64.exe ./cmd/workbridge-mcp
          sha256sum dist/workbridge-mcp-windows-amd64.exe


  windows-release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Build native Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -o dist/workbridge-mcp.exe ./cmd/workbridge-mcp
      - name: Black-box MCP smoke
        shell: pwsh
        run: ./scripts/Test-WorkBridgeBinary.ps1 -Binary ./dist/workbridge-mcp.exe
      - name: Build release archive
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          ./scripts/New-WorkBridgeRelease.ps1 -Binary ./dist/workbridge-mcp.exe -OutputDirectory ./dist/release -Version ci -SourceCommit $sourceCommit
          $archive = Resolve-Path ./dist/release/workbridge-mcp-ci-windows-x64.zip
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release archive was not created"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath ./dist/release-verify
          foreach ($required in @("workbridge-mcp.exe","README.md","THIRD_PARTY_NOTICES.md","WorkBridgeMCP.xml.template","release-manifest.json")) {
            if (-not (Test-Path -LiteralPath (Join-Path ./dist/release-verify $required) -PathType Leaf)) {
              throw "Release archive missing $required"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: workbridge-mcp-windows-x64
          path: dist/release/workbridge-mcp-ci-windows-x64.zip
          if-no-files-found: error
