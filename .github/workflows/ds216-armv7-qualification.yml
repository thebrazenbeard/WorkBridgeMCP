name: DS216 ARMv7 qualification

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ds216-armv7-qualification.yml"
  push:
    branches:
      - "research/ds216-armv7-qualification-20260929"

permissions:
  contents: read

jobs:
  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Run portable unit tests
        run: go test ./...
      - name: Cross-build DS216 candidate
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -o dist/workbridge-mcp-linux-armv7 ./cmd/workbridge-mcp
      - name: Inspect binary identity
        run: |
          file dist/workbridge-mcp-linux-armv7
          readelf -h dist/workbridge-mcp-linux-armv7
          go version -m dist/workbridge-mcp-linux-armv7
          sha256sum dist/workbridge-mcp-linux-armv7 | tee dist/workbridge-mcp-linux-armv7.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: workbridge-mcp-linux-armv7-ds216-candidate
          path: |
            dist/workbridge-mcp-linux-armv7
            dist/workbridge-mcp-linux-armv7.sha256
          if-no-files-found: error
